const days=[{"date":"11/17","dow":"TUESDAY","title":"抵達東京・新宿購物・金色不如歸","sub":"11 月 17 日｜長榮 BR192 07:15 台北松山起飛、11:00 羽田第3航廈抵達；新宿購物與金色不如歸晚餐","pill":"新宿","note":"去程確認：2026/11/17 長榮航空 BR192，台北松山 T1 07:15 起飛，東京羽田 T3 11:00 抵達（以機票及當日航班動態為準）。住宿：Hotel QUEEN ANNEX，新宿2-10-6，15:00後入住。下午依序逛一保堂、迪士尼旗艦店、KIDDY LAND、LUMINE EST 的 Lazy Hazy Planet 與 HARE。17:30 金色不如歸領晚餐整理券，18:30起按叫號用餐；晚間視體力散步花園神社、3D貓咪、歌舞伎町哥吉拉。營業時間仍須出發前確認。","events":[["07:15（台灣時間）","長榮 BR192｜台北松山機場 T1 起飛","依機票：11/17（二）07:15 台北松山 T1 出發、11:00 東京羽田 T3 抵達；日期及時間皆為當地時間。","https://www.google.com/maps/search/?api=1&query=Taipei+Songshan+Airport+Terminal+1"],["11:00（日本時間）","抵達東京羽田機場第3航廈｜BR192","長榮 BR192 抵達羽田第3航廈，預留入境與領行李時間。","https://www.google.com/maps/search/?api=1&query=Haneda+Airport+Terminal+3"],["12:30–14:00","前往 Hotel QUEEN ANNEX 放行李","東京都新宿區新宿2-10-6；15:00後入住，先詢問能否寄放行李。","https://www.google.com/maps/search/?api=1&query=Hotel+Queen+Annex+2-10-6+Shinjuku+Tokyo"],["14:00–14:30","簡單午餐","金色不如歸改成晚餐，下午先簡單吃。","https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+restaurants"],["14:30–15:10","一保堂茶舗 伊勢丹新宿店","伊勢丹新宿店；百貨約20:00打烊，茶飲外帶可能19:00先截止。","https://www.google.com/maps/search/?api=1&query=Ippodo+Tea+Isetan+Shinjuku"],["15:15–15:55","東京迪士尼旗艦店","Disney FLAGSHIP TOKYO；約21:00打烊。","https://www.google.com/maps/search/?api=1&query=Disney+FLAGSHIP+TOKYO"],["16:00–16:30","KIDDY LAND Shinjuku","新宿東口角色周邊商店；約20:30打烊。","https://www.google.com/maps/search/?api=1&query=Kiddy+Land+Shinjuku"],["16:35–17:05","Lazy Hazy Planet、HARE ルミネエスト","LUMINE EST 內的兩間店先逛；約21:00打烊，可視號碼牌狀況再回來。","https://www.google.com/maps/search/?api=1&query=Lumine+Est+Shinjuku"],["17:30","金色不如歸領晚餐整理券","SOBA HOUSE 金色不如帰 新宿御苑本店，新宿2-4-1；夜間整理券17:30開始，需依現場叫號及規則返回。","https://www.google.com/maps/search/?api=1&query=SOBA+HOUSE+Konjiki+Hototogisu+Shinjuku"],["18:30–19:30（彈性）","金色不如歸晚餐","晚間營業18:30–20:30（售完可能提早結束）；依整理券實際時段用餐。","https://www.google.com/maps/search/?api=1&query=SOBA+HOUSE+Konjiki+Hototogisu+Shinjuku"],["晚餐後","花園神社・夜間參拜","免費走訪夜間神社，御朱印窗口可能已關閉。","https://www.google.com/maps/search/?api=1&query=Hanazono+Shrine+Shinjuku"],["晚餐後（彈性）","新宿東口 3D 貓咪・哥吉拉夜景","Cross Shinjuku Vision 3D貓咪及歌舞伎町哥吉拉；如時間太晚，優先3D貓咪、隔天早起勿勉強。","https://www.google.com/maps/search/?api=1&query=Cross+Shinjuku+Vision"],["約 21:00 後","返回 Hotel QUEEN ANNEX 休息","隔日富士山行程07:50集合，請早點休息。","https://www.google.com/maps/search/?api=1&query=Hotel+Queen+Annex+2-10-6+Shinjuku+Tokyo"]]},{"date":"11/18","dow":"WEDNESDAY","title":"富士山一日遊・淺間公園離團","sub":"11 月 18 日｜07:50 新宿西口集合；15:10 預計離團","pill":"新宿 → 富士山","note":"住宿：四季之宿 Popura。預計 15:10 在新倉山淺間公園離團，必須先取得 KKday 同意，並確認實際停靠順序與接駁。","events":[["07:15–07:25（建議）","Hotel QUEEN ANNEX 搭計程車","從新宿 2-10-6 前往三井住友銀行新宿西口支店；原本估計 6 分鐘不再適用，請事先查詢車程並預留叫車與找集合點的時間，目標 07:40 前抵達。","https://www.google.com/maps/dir/?api=1&origin=Hotel+Queen+Annex+2-10-6+Shinjuku+Tokyo&destination=SMBC+Shinjuku+Nishiguchi+Branch&travelmode=driving"],["07:40 前","抵達集合點","三井住友銀行新宿西口支店，西新宿 1-7-1；確認導遊及集合位置。","https://www.google.com/maps/search/?api=1&query=SMBC+Shinjuku+Nishiguchi+Branch"],["07:50","KKday 富士山一日遊集合","實際景點順序與時間以旅行團當日安排為準。","https://www.kkday.com/zh-tw/product/266389-fuji-kawaguchiko-oshino-hakkai-sengen"],["白天","富士山周邊景點","依旅行團路線參觀；勿把示意景點當成保證停靠。","https://www.kkday.com/zh-tw/product/266389-fuji-kawaguchiko-oshino-hakkai-sengen"],["15:10（待確認）","新倉山淺間公園離團","離團安排需經業者同意；預先確認行李及離團後交通。","https://www.google.com/maps/search/?api=1&query=Arakurayama+Sengen+Park"],["下午–晚上","前往四季之宿 Popura","確認從淺間公園到旅館的交通、入住時間與晚餐。","https://www.google.com/maps/search/?api=1&query=Shiki+no+Yado+Popura"]]},{"date":"11/19","dow":"THURSDAY","title":"逆富士・東京鐵塔・今半・花園神社・淺草寺","sub":"11 月 19 日｜逆富士 → 河口湖富士山纜車 → 河口湖站 → 東京鐵塔・銀座今半・花園神社・淺草寺","pill":"逆富士 → 纜車 → 東京 → 淺草","note":"依照指定順序：逆富士 → 上午河口湖富士山全景纜車（09:15–11:30建議）→ 午餐、領行李 → 河口湖站（14:00目標）→ dotcom coffee 新富 → 芝公園與東京鐵塔夜景 → 人形町今半銀座晚餐。重要：若14:00才抵達河口湖站，無法在15:00抵達新富咖啡廳；15:00–16:00僅是希望時段，需提前離開河口湖、調整車次或將後面景點時間順延。11/19–11/22 住宿已確認：Skytree Tatami Hotel（墨田區業平4-16-6）；16:00 後入住，11/22 11:00 前退房。東京放行李時間仍須依實際抵達時間確認；晚餐後另安排新宿花園神社（與11/17兩天都去），再前往淺草寺夜間散步，最後返回押上住宿；銀座→新宿→淺草是明顯繞路，屬夜間彈性行程，若晚餐拖延或疲倦可直接回住宿。淺草寺晚上僅看寺院外觀與點燈，本堂及授與處已關閉。今半銀座店19:00兩位尚未訂位。 富士山全景纜車山麓站在河口湖畔淺川1163-1，單程約3分鐘，2026/11成人往返¥1,200；紅葉季可能排隊、遇強風可能停駛。纜車後回飯店取行李的方式需先與旅館確認。","events":[["06:00–08:00","河口湖湖畔拍逆富士","產屋崎或其他合適湖岸，視天氣、交通與旅館建議選擇。","https://www.google.com/maps/search/?api=1&query=Ubuyagasaki+Kawaguchiko"],["08:00–09:15","早餐・整理行李與準備退房","逆富士拍攝後回飯店早餐、整理行李；預先詢問四季之宿Popura是否可暫放行李，安排纜車後領取。","https://www.google.com/maps/search/?api=1&query=Lake+Kawaguchiko"],["11:30–13:30","河口湖午餐・取行李・前往車站","纜車下山後用午餐，回四季之宿Popura取行李或依飯店建議安排寄放與接駁；14:00到河口湖站為目標，需預留交通。","https://www.google.com/maps/search/?api=1&query=Kawaguchiko"],["約 14:00","抵達河口湖站","午餐及纜車後前往河口湖站；回東京的巴士／電車尚未訂。若要保留晚上銀座今半、花園神社、淺草寺，請優先確認14:00左右可出發的車次。","https://www.google.com/maps/search/?api=1&query=Kawaguchiko+Station"],["14:00 後（返程車班待訂）","河口湖站 → 東京、飯店放行李","返東京及放行李的時間依交通和住宿位置決定；若14:00才到河口湖站，無法趕上15:00咖啡廳。 新飯店為Skytree Tatami Hotel（墨田區業平4-16-6），不在新宿；若抵達東京後先去寄放行李，須另計至押上往返交通。","https://bus.fujikyu.co.jp/en/highway/fujisan/tokyo/"],["15:00–16:00（目標，需調整交通）","dotcom coffee 新富","東京都中央區新富1-5-10；店家營業時間仍須出發前確認。注意：14:00河口湖站與15:00到咖啡廳的時間衝突，尚不能視為確定。","https://www.google.com/maps/search/?api=1&query=dotcom+coffee+Shintomi+1-5-10+Tokyo"],["16:20–17:10（彈性）","前往芝公園・東京鐵塔周邊","咖啡廳後從新富前往芝公園、赤羽橋／御成門一帶，依實際交通時間調整。","https://www.google.com/maps/dir/?api=1&origin=dotcom+coffee+Shintomi+1-5-10+Tokyo&destination=Shiba+Park+Tokyo&travelmode=transit"],["17:10–18:00（彈性）","芝公園・東京鐵塔夜景拍照","只看東京鐵塔夜景、外部拍照，不安排登塔；實際亮燈時間依當日為準。","https://www.google.com/maps/search/?api=1&query=Tokyo+Tower"],["18:00–18:50","搭車前往銀座晚餐","前往銀座6-8-7交詢ビル5F，建議預留交通與找入口時間。","https://www.google.com/maps/dir/?api=1&origin=Tokyo+Tower+Tokyo&destination=Ningyocho+Imahan+Ginza+6-8-7&travelmode=transit"],["19:00–20:30（建議訂位）","人形町今半 銀座店｜壽喜燒晚餐","交詢ビル5F。預計19:00兩人用餐，尚未訂位。","https://restaurant.imahan.com/ginza/"],["20:30–21:10（估計）","銀座今半 → 新宿花園神社｜搭車","從銀座前往新宿三丁目、花園神社。這段是額外繞路，交通約需30–40分鐘（含步行，依當日班次）；19:00今半晚餐尚未訂位，抵達時間需彈性調整。","https://www.google.com/maps/dir/?api=1&origin=Ningyocho+Imahan+Ginza+Tokyo&destination=Hanazono+Shrine+S let active=0,map=null,layer=null;

function txt(parent,tag,value,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value;parent.append(e);return e}
function link(parent,text,url){if(!/^https?:\/\//.test(url||''))return;const a=txt(parent,'a',text,'a');a.href=url;a.target='_blank';a.rel='noopener noreferrer'}
function routeURL(row){const names=row[2].split(' ').map(k=>points[k]?.[0]).filter(Boolean);if(names.length<2)return null;const query='origin='+encodeURIComponent(names[0])+'&destination='+encodeURIComponent(names[names.length-1])+'&travelmode='+encodeURIComponent(row[3]||'transit');return 'https://www.google.com/maps/dir/?api=1&'+query+(names.length>2?'&waypoints='+names.slice(1,-1).map(encodeURIComponent).join('%7C'):'')}

const tl=el('timeline');tl.replaceChildren();d.events.forEach(e=>{const row=txt(tl,'div','', 'event');txt(row,'div',e[0],'time');const body=txt(row,'div','');txt(body,'h3',e[1]);if(e[2])txt(body,'p',e[2]);if(e[3])link(body,'📍 地圖／景點資訊 ↗',e[3])});
const list=el('routes');list.replaceChildren();all.forEach((l,n)=>{const row=txt(list,'div','','route-row');const r=txt(row,'div',(n+1)+'. '+(l[0]==='步行'?'🚶 ':l[0]==='跟團'?'🚌 ':'🚆 ')+l[1]);const u=routeURL(l);if(u)link(row,'導航 ↗',u)});

if(layer)map.removeLayer(layer);layer=L.featureGroup().addTo(map);
const used=new Set(),colors={'搭車':'#5072ad','步行':'#3c815c','跟團':'#bd893e'};

if(layer.getLayers().length)map.fitBounds(layer.getBounds(),{padding:[20,20],maxZoom:13});
