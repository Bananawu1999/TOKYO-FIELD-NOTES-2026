<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141c27"><title>TOKYO FIELD NOTES 2026</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#edf2f7;background:#101720}*{box-sizing:border-box}body{margin:0}a{color:#89c8ff}button,input,textarea{font:inherit}button{cursor:pointer}header{padding:34px 20px 22px;background:linear-gradient(135deg,#263b53,#121922)}.wrap{max-width:820px;margin:auto}.eyebrow{color:#92b3cc;letter-spacing:.23em;font-size:11px}h1{margin:10px 0 5px;font-size:clamp(26px,5vw,40px);letter-spacing:.04em}small,.muted{color:#9eafbf}.tabs{display:flex;gap:8px;overflow:auto;padding:13px 15px;position:sticky;top:0;background:#101720ee;backdrop-filter:blur(8px);z-index:5}.tabs button{background:#223141;border:1px solid #36495b;color:#e7f0f8;padding:11px 14px;border-radius:12px;white-space:nowrap}.tabs button.active{background:#dfedff;color:#182636}main{padding:8px 18px 55px}.panel{background:#1c2937;border:1px solid #33475b;border-radius:18px;padding:20px;margin:15px 0}.tag{font-size:12px;color:#b7d2e8}.panel h2{margin:5px 0 10px;font-size:22px}.stop{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #334352}.stop:last-child{border:0}.time{font-weight:700;color:#9fcff4;font-size:13px}.name{font-weight:650}.note{font-size:13px;line-height:1.6;color:#a9bbca;margin-top:5px}.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.actions a,.actions button,.action{border:1px solid #405d73;background:#253a4c;color:#cce8fb;border-radius:9px;padding:8px 11px;text-decoration:none;font-size:12px}.action.primary{background:#d1e8ff;color:#193147;border-color:#d1e8ff;font-weight:bold}.field{display:grid;gap:5px;margin:10px 0}input,textarea{width:100%;border:1px solid #405568;border-radius:10px;padding:11px;background:#121e29;color:#f1f7fc}label{font-size:12px;color:#b9cad8}.flex{display:flex;gap:9px;flex-wrap:wrap}.flex>*{flex:1}.hidden{display:none}.warn{border-left:3px solid #edb66d;padding-left:11px;color:#ddc7ac;font-size:13px;line-height:1.7}.headrow{display:flex;justify-content:space-between;gap:10px;align-items:start}.pill{border:1px solid #4f6a7e;border-radius:999px;padding:5px 9px;font-size:11px;color:#bdd4e9}.expense{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #314759;padding:10px 0;font-size:14px}.check{display:flex;align-items:center;gap:12px;margin:13px 0}.check input{width:18px;height:18px}footer{text-align:center;font-size:11px;color:#7890a2;padding:25px}
</style></head><body><header><div class="wrap"><div class="eyebrow">TRAVEL JOURNAL · 17—22 NOV 2026</div><h1>TOKYO FIELD NOTES</h1><small>東京 · 河口湖 · 鎌倉 ｜ 6 DAYS / 5 NIGHTS</small></div></header>
<nav class="tabs wrap" id="tabs"></nav><main class="wrap"><div id="view"></div></main><footer>OFFLINE-READY DATA ON THIS DEVICE · TOKYO 2026</footer>
<script>
const dates=["11/17","11/18","11/19","11/20","11/21","11/22"];
const itinerary=[
{title:"抵達東京 · 新宿購物",stay:"西新宿公寓｜西新宿 4-38-12",tip:"11:00 抵達羽田，先到西新宿公寓寄放行李，再逛新宿。",stops:[
["11:00","羽田機場","國際航班抵達、入境與領行李","Haneda Airport,Tokyo"],
["14:00","西新宿公寓","4-38-12 Nishishinjuku, Shinjuku-ku, Tokyo","4-38-12 Nishishinjuku, Shinjuku-ku, Tokyo"],
["15:00","東京迪士尼旗艦店","Disney FLAGSHIP TOKYO","Disney FLAGSHIP TOKYO Shinjuku"],
["16:30","HARE / LUMINE EST","逛服飾、商場及新宿東口周邊","LUMINE EST Shinjuku"],
["18:30","新宿晚餐","自由用餐與購物","Shinjuku Station Tokyo"]]},
{title:"富士山一日遊 · 淺間公園離團",stay:"四季之宿 Popura｜河口湖",tip:"07:25–07:30 搭計程車出發；07:50 新宿西口集合。預計 15:10 淺間公園離團，須先獲 KKday 確認。",stops:[
["07:25","搭計程車出發","從西新宿公寓到集合點，預估 6 分鐘，請保留找車緩衝","4-38-12 Nishishinjuku, Shinjuku-ku, Tokyo"],
["07:50","三井住友銀行 新宿西口支店","KKday 巴士集合，建議 07:40 前抵達","SMBC Shinjuku Nishiguchi Branch"],
["上午","富士山周邊 KKday 一日遊","依旅行團當日實際停靠順序","Mount Fuji Japan"],
["15:10","新倉山淺間公園","預計離團；需要事先獲旅行社同意","Arakurayama Sengen Park"],
["傍晚","四季之宿 Popura","離團後自行前往住宿，交通待確認","Shiki no Yado Popura Fujikawaguchiko"]]},
{title:"逆富士 · 返回新宿 · 池袋",stay:"新宿住宿｜待訂",tip:"清晨能否看到逆富士取決於天氣與湖面風勢。約 14:00 由旅館協助送往河口湖站。",stops:[
["06:00","河口湖湖畔 · 逆富士","產屋崎或長崎公園擇一，依旅館協助及天氣決定","Ubuyagasaki Lake Kawaguchi"],
["08:00","早餐與湖畔散步","回旅館整理行李、退房","Lake Kawaguchiko"],
["14:00","河口湖站","由旅館老闆協助送至車站；預訂高速巴士或電車","Kawaguchiko Station"],
["傍晚","新宿站","返回東京、先安置行李","Shinjuku Station Tokyo"],
["晚上","池袋","百貨、動漫商店、晚餐，自由彈性安排","Ikebukuro Station Tokyo"]]},
{title:"鎌倉 · 神社御朱印",stay:"新宿住宿｜待訂",tip:"新宿搭 JR 湘南新宿線往鎌倉；鎌倉站到長谷站搭江之電。御朱印請留意授與所時間。",stops:[
["08:00","新宿出發","JR 往鎌倉","Shinjuku Station Tokyo"],
["09:30","鶴岡八幡宮","參拜並收集御朱印","Tsurugaoka Hachimangu"],
["10:30","小町通","午餐、在地伴手禮與街景","Komachi-dori Kamakura"],
["13:15","長谷寺","江之電到長谷站後步行；收集御朱印","Hasedera Kamakura"],
["14:30","鎌倉大佛 · 高德院","參拜與拍照","Kotoku-in Kamakura"]]},
{title:"銀杏 · 原宿 · 表參道",stay:"新宿住宿｜待訂",tip:"早上銀杏大道拍照；原宿與表參道店家清單之後可再補。",stops:[
["08:30","神宮外苑銀杏大道","早到避開主要人潮，實際葉色看天氣","Meiji Jingu Gaien Icho Namiki Tokyo"],
["11:00","原宿站","街區散步與購物","Harajuku Station"],
["11:30","竹下通","服飾、甜點與特色商店","Takeshita Street Tokyo"],
["13:30","表參道","設計選物店、咖啡廳、服飾店","Omotesando Tokyo"]]},
{title:"東京返程 · 羽田 → 松山",stay:"返程日",tip:"11:00 航班自羽田出發，建議約 08:00 到機場；實際航廈與交通請依航空公司資訊確認。",stops:[
["07:00","新宿出發","由最終住宿前往羽田機場","Shinjuku Station Tokyo"],
["08:00","羽田機場","辦理報到、行李託運、安檢與出境","Haneda Airport Tokyo"],
["11:00","返回松山","羽田起飛","Haneda Airport Tokyo"]]}];
const key="tokyo_field_notes_github_v1";
let data;try{data=JSON.parse(localStorage.getItem(key)||"null")}catch{}
if(!data||!Array.isArray(data.days))data={days:itinerary.map(d=>structuredClone(d.stops)),check:[],expenses:[]};
let active=0,section="trip";
const save=()=>localStorage.setItem(key,JSON.stringify(data));
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const map=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function nav(){document.getElementById("tabs").innerHTML=dates.map((d,i)=>'<button class="'+(section==="trip"&&active===i?"active":"")+'" onclick="selectDay('+i+')">DAY '+(i+1)+' · '+d+'</button>').join("")+'<button class="'+(section==="check"?"active":"")+'" onclick="selectSection(\'check\')">待辦</button><button class="'+(section==="money"?"active":"")+'" onclick="selectSection(\'money\')">記帳</button><button onclick="exportData()">備份</button>'}
function selectDay(i){active=i;section="trip";render()}function selectSection(s){section=s;render()}
function render(){nav();if(section==="trip")return renderTrip();if(section==="check")return renderChecks();renderMoney()}
function renderTrip(){let d=itinerary[active],items=data.days[active]||[];document.getElementById("view").innerHTML='<section class="panel"><div class="headrow"><div><span class="tag">'+dates[active]+' · DAY '+(active+1)+'</span><h2>'+safe(d.title)+'</h2></div><span class="pill">'+items.length+' STOPS</span></div><div class="muted">🏨 '+safe(d.stay)+'</div><p class="warn">'+safe(d.tip)+'</p></section><section class="panel"><div class="headrow"><h2>當日行程</h2><button class="action" onclick="addStop()">＋ 新增</button></div>'+items.map((s,i)=>'<div class="stop"><div class="time">'+safe(s[0])+'</div><div><div class="name">'+safe(s[1])+'</div><div class="note">'+safe(s[2])+'</div><div class="actions"><a target="_blank" rel="noopener" href="'+map(s[3]||s[1])+'">📍 地圖</a><button onclick="editStop('+i+')">編輯</button><button onclick="removeStop('+i+')">刪除</button></div></div></div>').join("")+'</section><section class="panel"><h2>新增／編輯行程</h2><div id="editForm" class="hidden"></div><p class="muted">旅行期間的修改會保存在目前這台手機的瀏覽器內；尚未設定同行者雲端同步。</p></section>'}
function form(idx){let s=idx>=0?data.days[active][idx]:["","","",""];let el=document.getElementById("editForm");el.className="";el.innerHTML='<div class="field"><label>時間</label><input id="fTime" value="'+safe(s[0])+'" placeholder="例：14:30"></div><div class="field"><label>景點名稱</label><input id="fTitle" value="'+safe(s[1])+'"></div><div class="field"><label>備註</label><textarea id="fNote" rows="3">'+safe(s[2])+'</textarea></div><div class="field"><label>Google 地圖搜尋地點或地址</label><input id="fMap" value="'+safe(s[3])+'"></div><button class="action primary" onclick="saveStop('+idx+')">儲存行程</button> <button class="action" onclick="renderTrip()">取消</button>';el.scrollIntoView({behavior:"smooth",block:"center"})}
function addStop(){form(-1)}function editStop(i){form(i)}function saveStop(i){const el=id=>document.getElementById(id).value.trim();let x=[el("fTime"),el("fTitle"),el("fNote"),el("fMap")];if(!x[1])return alert("請輸入景點名稱");if(i<0)data.days[active].push(x);else data.days[active][i]=x;save();render()}function removeStop(i){if(confirm("確定刪除這個景點？")){data.days[active].splice(i,1);save();render()}}
const defaultChecks=["護照／機票資料","日本網路 SIM 或 eSIM","11/18 KKday 離團取得同意","11/19 河口湖回新宿交通訂位","11/19–21 新宿飯店確認","御朱印帳與現金","11/22 羽田航廈及接駁確認"];
function renderChecks(){document.getElementById("view").innerHTML='<section class="panel"><h2>旅行待辦</h2>'+defaultChecks.map((s,i)=>'<label class="check"><input type="checkbox" '+(data.check.includes(i)?"checked":"")+' onchange="toggleCheck('+i+',this.checked)"><span>'+safe(s)+'</span></label>').join("")+'</section>'}function toggleCheck(i,v){data.check=v?[...new Set([...data.check,i])]:data.check.filter(x=>x!==i);save()}
function renderMoney(){let sum=data.expenses.reduce((a,b)=>a+Number(b.amount||0),0);document.getElementById("view").innerHTML='<section class="panel"><h2>旅費記錄</h2><p class="muted">總計（日圓）</p><h2>¥'+sum.toLocaleString()+'</h2><div class="field"><label>項目</label><input id="eName" placeholder="例：午餐"></div><div class="field"><label>金額 JPY</label><input id="eAmount" type="number" min="0" placeholder="1200"></div><button class="action primary" onclick="addExpense()">記錄支出</button>'+data.expenses.map((e,i)=>'<div class="expense"><span>'+safe(e.name)+'</span><span>¥'+Number(e.amount).toLocaleString()+' <button class="action" onclick="removeExpense('+i+')">刪除</button></span></div>').join("")+'</section>'}
function addExpense(){let name=document.getElementById("eName").value.trim(),amount=Number(document.getElementById("eAmount").value);if(!name||!Number.isFinite(amount)||amount<=0)return alert("請填寫項目與有效金額");data.expenses.push({name,amount});save();renderMoney()}function removeExpense(i){data.expenses.splice(i,1);save();renderMoney()}
function exportData(){const blob=new Blob([JSON.stringify({app:"TOKYO FIELD NOTES 2026",data,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="tokyo-field-notes-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script></body></html>
